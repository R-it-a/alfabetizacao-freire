<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testes do silabador</title>
<style>
  :root {
    --bg: #F2F4F7; --card: #fff; --rule: #C9D1DE;
    --tx: #161B24; --tx2: #4A5464; --tx3: #6E7889;
    --ok: #1F6B4A; --ok-bg: #DFF0E7;
    --bad: #9B3D2E; --bad-bg: #F8E5E1;
    --ink: #1B3A6B; --luz: #A8741A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E131C; --card: #151C28; --rule: #2C3849;
      --tx: #E8ECF3; --tx2: #AEB9C9; --tx3: #7E8B9D;
      --ok: #6FCFA0; --ok-bg: #12291F;
      --bad: #E89685; --bad-bg: #2B1815;
      --ink: #8CB0EC; --luz: #E0AE55;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: clamp(1rem,4vw,2.5rem);
    background: var(--bg); color: var(--tx);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 52rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 0 0 .3rem; }
  .sub { color: var(--tx2); margin: 0 0 1.5rem; font-size: .95rem; }
  #placar {
    display: inline-flex; align-items: baseline; gap: .6rem;
    font-family: ui-monospace, Consolas, monospace; font-weight: 700;
    padding: .55rem .9rem; border-radius: 3px; margin-bottom: 1.5rem;
  }
  #placar.pass { background: var(--ok-bg); color: var(--ok); }
  #placar.fail { background: var(--bad-bg); color: var(--bad); }
  #resultado {
    font-family: ui-monospace, Consolas, "Liberation Mono", monospace;
    font-size: .78rem; line-height: 1.65; white-space: pre; overflow-x: auto;
    background: var(--card); border: 1px solid var(--rule); border-radius: 3px;
    padding: 1.1rem 1.2rem; color: var(--tx2); margin: 0;
  }
  .nota { margin-top: 1.25rem; font-size: .87rem; color: var(--tx3); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Testes do silabador</h1>
  <p class="sub">Os mesmos 80 casos da suíte Python, rodando no navegador contra <code>silabador.js</code>.</p>
  <div id="placar">carregando…</div>
  <pre id="resultado">…</pre>
  <p class="nota">
    Precisa ser servido por HTTP (módulos ES não carregam por <code>file://</code>).
    Rode <code>python -m http.server 8000</code> nesta pasta e abra
    <code>http://localhost:8000/teste-silabador.html</code>.
  </p>
</div>

<script type="module">
import {
  silabar, analisar, familia, expandirGrupo,
  fichaDescoberta, palavrasPossiveis, temSomVariavel
} from './silabador.js';

const ANGICOS = [
  ['belota',     ['be','lo','ta']],
  ['sapato',     ['sa','pa','to']],
  ['voto',       ['vo','to']],
  ['povo',       ['po','vo']],
  ['salina',     ['sa','li','na']],
  ['feira',      ['fei','ra']],
  ['milho',      ['mi','lho']],
  ['goleiro',    ['go','lei','ro']],
  ['cozinha',    ['co','zi','nha']],
  ['tijela',     ['ti','je','la']],
  ['jarra',      ['jar','ra']],
  ['fogão',      ['fo','gão']],
  ['chibanca',   ['chi','ban','ca']],
  ['xiquexique', ['xi','que','xi','que']],
  ['expresso',   ['ex','pres','so']],
  ['bilro',      ['bil','ro']],
  ['almofada',   ['al','mo','fa','da']]
];

const COTIDIANO = [
  ['cuscuz',   ['cus','cuz']],
  ['tijolo',   ['ti','jo','lo']],
  ['feijão',   ['fei','jão']],
  ['panela',   ['pa','ne','la']],
  ['obra',     ['o','bra']],
  ['trabalho', ['tra','ba','lho']],
  ['dinheiro', ['di','nhei','ro']],
  ['chuva',    ['chu','va']],
  ['carro',    ['car','ro']],
  ['passa',    ['pas','sa']],
  ['escola',   ['es','co','la']],
  ['arroz',    ['ar','roz']],
  ['casa',     ['ca','sa']],
  ['comida',   ['co','mi','da']],
  ['galinha',  ['ga','li','nha']],
  ['farinha',  ['fa','ri','nha']],
  ['mandioca', ['man','di','o','ca']],
  ['roupa',    ['rou','pa']],
  ['peixe',    ['pei','xe']],
  ['carne',    ['car','ne']],
  ['leite',    ['lei','te']],
  ['banana',   ['ba','na','na']],
  ['enxada',   ['en','xa','da']],
  ['terra',    ['ter','ra']],
  ['labuta',   ['la','bu','ta']]
];

const DIFICEIS = [
  ['saúde',    ['sa','ú','de']],
  ['país',     ['pa','ís']],
  ['ruína',    ['ru','í','na']],
  ['poeta',    ['po','e','ta']],
  ['voo',      ['vo','o']],
  ['dia',      ['di','a']],
  ['rua',      ['ru','a']],
  ['família',  ['fa','mí','lia']],
  ['história', ['his','tó','ria']],
  ['água',     ['á','gua']],
  ['quando',   ['quan','do']],
  ['quilo',    ['qui','lo']],
  ['guerra',   ['guer','ra']],
  ['nascer',   ['nas','cer']],
  ['atleta',   ['a','tle','ta']],
  ['ritmo',    ['rit','mo']],
  ['planta',   ['plan','ta']],
  ['cravo',    ['cra','vo']],
  ['sal',      ['sal']],
  ['mar',      ['mar']],
  ['pá',       ['pá']]
];

const FAMILIAS = [
  ['ti',   ['ta','te','ti','to','tu']],
  ['jo',   ['ja','je','ji','jo','ju']],
  ['lo',   ['la','le','li','lo','lu']],
  ['lho',  ['lha','lhe','lhi','lho','lhu']],
  ['nha',  ['nha','nhe','nhi','nho','nhu']],
  ['ban',  ['ban','ben','bin','bon','bun']],
  ['al',   ['al','el','il','ol','ul']],
  ['que',  ['ca','que','qui','co','cu']],
  ['gue',  ['ga','gue','gui','go','gu']],
  ['co',   ['ca','ce','ci','co','cu']],
  ['pres', ['pras','pres','pris','pros','prus']]
];

const linhas = [];
const falhas = [];
let total = 0;

const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function checa(rotulo, obtido, esperado) {
  total += 1;
  const ok = eq(obtido, esperado);
  if (!ok) falhas.push([rotulo, obtido, esperado]);
  return ok;
}

function bloco(titulo, casos, fn) {
  linhas.push('', titulo, '-'.repeat(titulo.length));
  for (const [entrada, esperado] of casos) {
    const obtido = fn(entrada);
    const ok = checa(entrada, obtido, esperado);
    linhas.push(
      `  ${ok ? 'ok   ' : 'FALHA'}  ${entrada.padEnd(12)} -> ${obtido.join('-')}` +
      (ok ? '' : `   (esperado: ${esperado.join('-')})`)
    );
  }
}

bloco('As 17 palavras geradoras de Angicos', ANGICOS, silabar);
bloco('Palavras do cotidiano', COTIDIANO, silabar);
bloco('Casos difíceis', DIFICEIS, silabar);
bloco('Famílias fonêmicas', FAMILIAS, familia);

// ficha de TIJOLO
linhas.push('', 'Ficha de descoberta — TIJOLO', '-'.repeat(28));
const f = fichaDescoberta('tijolo');
linhas.push(`  sílabas: ${f.silabas.join('-')}`);
for (const linha of f.grade) linhas.push('  ' + linha.map(s => s.toUpperCase()).join('  '));

const LEXICO = `tatu tijolo loja jato lata luta lote tela teto tato tolo lula juta
tijela late talo tule jota lajota jati casa livro pedra mesa`.split(/\s+/);
const achadas = palavrasPossiveis(f, LEXICO);
linhas.push(`  formáveis no léxico de teste (${achadas.length}): ${achadas.join(', ')}`);
checa('potencia_gerativa(tijolo) >= 15', achadas.length >= 15, true);

// generalização
linhas.push('', 'Regra de generalização — EXPRESSO', '-'.repeat(33));
const irmas = expandirGrupo('pres');
linhas.push('  a partir de \'pres\', o professor também apresenta:');
for (const l of irmas) linhas.push('    ' + l.map(s => s.toUpperCase()).join('  '));
checa('expandirGrupo(pres) gera irmas', irmas.length >= 5, true);
checa('expandirGrupo(ti) vazio', expandirGrupo('ti'), []);

// som variável
linhas.push('', 'Sílabas que exigem a aula do C forte e fraco', '-'.repeat(44));
for (const s of ['co','ga','ti','ban','que']) {
  linhas.push(`  ${s.padEnd(6)} som variável: ${temSomVariavel(s) ? 'sim' : 'não'}`);
}
checa('temSomVariavel(co)', temSomVariavel('co'), true);
checa('temSomVariavel(ga)', temSomVariavel('ga'), true);
checa('temSomVariavel(ti)', temSomVariavel('ti'), false);

// análise
linhas.push('', 'Análise de sílaba', '-'.repeat(17));
for (const s of ['ti','ban','pres','al','cha']) {
  const a = analisar(s);
  linhas.push(`  ${s.padEnd(6)} onset=${(a.onset||'-').padEnd(4)} núcleo=${(a.nucleo||'-').padEnd(3)} coda=${a.coda||'-'}`);
}

const passaram = total - falhas.length;
linhas.push('', '='.repeat(46), `${passaram} de ${total} verificações passaram`);
if (falhas.length) {
  linhas.push('', 'Falhas:');
  for (const [r, o, e] of falhas) {
    linhas.push(`  ${String(r).padEnd(12)} obtido=${JSON.stringify(o)}  esperado=${JSON.stringify(e)}`);
  }
}

document.getElementById('resultado').textContent = linhas.join('\n');
const placar = document.getElementById('placar');
placar.className = falhas.length ? 'fail' : 'pass';
placar.textContent = falhas.length
  ? `RESULTADO ${passaram}/${total} — ${falhas.length} falha(s)`
  : `RESULTADO ${passaram}/${total} — tudo passou`;
</script>
</body>
</html>
