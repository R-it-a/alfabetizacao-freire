<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Alfabetização de adultos pelo método Paulo Freire">
  <title>Palavra</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="em-casa">
  <div id="abertura" class="abertura" aria-hidden="true">
    <div class="abertura-mascote"></div>
    <div class="abertura-nome"><span>pa</span><span>la</span><span>vra</span></div>
  </div>
  <header class="topo">
    <button id="fechar" class="btn-icone" aria-label="Sair da lição"></button>
    <div class="progresso" role="progressbar" aria-label="Progresso da lição" aria-valuemin="0" aria-valuemax="100">
      <div id="barra" class="progresso-barra"></div>
    </div>
    <button id="repetir" class="btn-icone" aria-label="Ouvir de novo"></button>
  </header>
  <section class="cena" aria-live="polite">
    <div id="mascote" class="mascote"></div>
    <div class="balao"><p id="legenda" class="legenda"></p></div>
  </section>
  <main id="tela" class="tela"></main>
  <div id="aviso" class="aviso-baixo" hidden></div>
  <div id="confete" class="confete" aria-hidden="true"></div>
  <noscript>Este aplicativo precisa de JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
